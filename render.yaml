services:
  - type: web
    name: wpgo-renderer-ga
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./renderer/Dockerfile
    dockerContext: ./renderer
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_RENDER_TOKEN
        generateValue: true
      - key: WPGO_RENDER_ALLOWED_HOSTS
        value: ""
      - key: WPGO_RENDER_ALLOW_ANY_PUBLIC
        value: "1"
      - key: WPGO_RENDER_MAX_CONCURRENCY
        value: "1"
      - key: PORT
        value: "10000"

  - type: keyvalue
    name: wpgo-mcp-state
    region: frankfurt
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: wpgo-mcp-ga
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: cd mcp-gateway && npm ci
    startCommand: cd mcp-gateway && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_REQUIRE_SHARED_OAUTH_STATE
        value: "1"
      - key: WPGO_MCP_SECRET
        generateValue: true
      - key: WPGO_MCP_PUBLIC_BASE
        value: "https://wpgo-mcp-ga.onrender.com"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wpgo-mcp-state
          property: connectionString

  - type: web
    name: wpgo-control-plane-ga
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./control-plane/Dockerfile
    dockerContext: ./control-plane
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_CONTROL_ADMIN_TOKEN
        generateValue: true
      - key: WPGO_SIGNING_SEED
        generateValue: true
      - key: WPGO_ALLOW_UNBOUND_LICENSES
        value: "0"
      - key: WPGO_LICENSES_JSON
        value: "{}"
      - key: WPGO_REVOKED_LICENSE_IDS
        value: ""
      - key: WPGO_RELEASE_VERSION
        value: "4.5.0-rc.2"
      - key: WPGO_RELEASE_PACKAGE
        value: ""
      - key: WPGO_RELEASE_SHA256
        value: ""
      - key: WPGO_RELEASE_URL
        value: ""
      - key: WPGO_RELEASE_CHANGELOG
        value: "WPGo 4.5 RC2 commercial-readiness release."
      - key: PORT
        value: "10000"

  - type: web
    name: wpgo-commercial-web
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: cd portal && npm ci
    startCommand: cd portal && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_PORTAL_CSRF_SECRET
        generateValue: true
      - key: WPGO_COMMERCIAL_API
        value: "https://wpgo-commercial-api.onrender.com"
      - key: WPGO_MCP_GATEWAY
        value: "https://wpgo-mcp-ga.onrender.com"

  - type: web
    name: wpgo-commercial-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: cd commercial-api && npm ci
    startCommand: cd commercial-api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: wpgo-commercial-db
          property: connectionString
      - key: WPGO_SESSION_SECRET
        generateValue: true
      - key: WPGO_CONTROL_ADMIN_TOKEN
        fromService:
          name: wpgo-control-plane-ga
          type: web
          envVarKey: WPGO_CONTROL_ADMIN_TOKEN
      - key: WPGO_PORTAL_URL
        value: "https://wpgo-commercial-web.onrender.com"
      - key: WPGO_DEV_AUTH
        value: "0"
      - key: RESEND_API_KEY
        sync: false
      - key: WPGO_LOGIN_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO
        sync: false
      - key: STRIPE_PRICE_SOLO_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: STRIPE_PRICE_AGENCY_YEARLY
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_SCALE_YEARLY
        sync: false

databases:
  - name: wpgo-commercial-db
    plan: 0.1c-256mb
    region: frankfurt
