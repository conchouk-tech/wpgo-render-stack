envVarGroups:
  - name: wpgo-control-shared
    envVars:
      - key: WPGO_CONTROL_ADMIN_TOKEN
        generateValue: true

services:
  - type: web
    name: wpgo-renderer-ga
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./renderer/Dockerfile
    dockerContext: ./renderer
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_RENDER_TOKEN
        generateValue: true
      - key: WPGO_RENDER_ALLOWED_HOSTS
        value: ""
      - key: WPGO_RENDER_ALLOW_ANY_PUBLIC
        value: "0"
      - key: WPGO_RENDER_ALLOW_NO_TOKEN
        value: "0"
      - key: WPGO_RENDER_ALLOW_HTTP
        value: "0"
      - key: WPGO_RENDER_MAX_CONCURRENCY
        value: "3"
      - key: WPGO_LICENSE_VALIDATE_URL
        value: "https://wpgo-control-plane-ga.onrender.com/v1/license/validate"
      - key: PORT
        value: "10000"

  - type: web
    name: wpgo-control-plane-ga
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./control-plane/Dockerfile
    dockerContext: ./control-plane
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: wpgo-commercial-db
          property: connectionString
      - fromGroup: wpgo-control-shared
      - key: WPGO_SIGNING_SEED
        generateValue: true
      - key: WPGO_ALLOW_UNBOUND_LICENSES
        value: "0"
      - key: WPGO_LICENSES_JSON
        value: "{}"
      - key: WPGO_REVOKED_LICENSE_IDS
        value: ""
      - key: WPGO_RELEASE_VERSION
        value: "4.5.0"
      - key: WPGO_RELEASE_PACKAGE
        value: ""
      - key: WPGO_RELEASE_SHA256
        value: ""
      - key: WPGO_RELEASE_URL
        value: ""
      - key: PORT
        value: "10000"

  - type: web
    name: wpgo-commercial-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd portal && npm install
    startCommand: cd portal && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WPGO_COMMERCIAL_API
        value: "https://wpgo-commercial-api.onrender.com"
      - key: WPGO_PORTAL_CSRF_SECRET
        generateValue: true
      - key: WPGO_PORTAL_API_TIMEOUT_MS
        value: "8000"

  - type: web
    name: wpgo-commercial-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd commercial-api && npm install
    startCommand: cd commercial-api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: wpgo-commercial-db
          property: connectionString
      - fromGroup: wpgo-control-shared
      - key: WPGO_SESSION_SECRET
        generateValue: true
      - key: WPGO_LICENSE_VALIDATE_URL
        value: "https://wpgo-control-plane-ga.onrender.com/v1/license/validate"
      - key: WPGO_LICENSE_ISSUE_URL
        value: "https://wpgo-control-plane-ga.onrender.com/v1/admin/license/issue"
      - key: WPGO_PORTAL_URL
        value: "https://wpgo-commercial-web.onrender.com"
      - key: WPGO_DEV_AUTH
        value: "0"
      - key: WPGO_REQUIRE_EMAIL
        value: "1"
      - key: WPGO_REQUIRE_BILLING
        value: "1"
      - key: WPGO_FOUNDER_EMAILS
        sync: false
      - key: WPGO_EMAIL_PROVIDER
        sync: false
      - key: WPGO_EMAIL_API_KEY
        sync: false
      - key: WPGO_EMAIL_FROM
        sync: false
      - key: WPGO_EMAIL_WEBHOOK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO
        sync: false
      - key: STRIPE_PRICE_SOLO_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: STRIPE_PRICE_AGENCY_YEARLY
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_SCALE_YEARLY
        sync: false
