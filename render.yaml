services:
  - type: web
    name: wpgo-renderer-ga
    runtime: docker
    plan: free
    dockerfilePath: ./renderer/Dockerfile
    dockerContext: ./renderer
    envVars:
      - key: WPGO_RENDER_TOKEN
        generateValue: true
      - key: WPGO_RENDER_ALLOWED_HOSTS
        value: ""
      - key: WPGO_RENDER_ALLOW_ANY_PUBLIC
        value: "1"
      - key: WPGO_RENDER_MAX_CONCURRENCY
        value: "1"
      - key: PORT
        value: "10000"

  - type: keyvalue
    name: wpgo-mcp-state
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: wpgo-mcp-ga
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd mcp-gateway && npm install
    startCommand: cd mcp-gateway && npm start
    healthCheckPath: /health
    envVars:
      - key: WPGO_MCP_SECRET
        generateValue: true
      - key: WPGO_MCP_PUBLIC_BASE
        value: "https://wpgo-mcp-ga.onrender.com"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wpgo-mcp-state
          property: connectionString

  - type: web
    name: wpgo-control-plane-ga
    runtime: docker
    plan: free
    dockerfilePath: ./control-plane/Dockerfile
    dockerContext: ./control-plane
    healthCheckPath: /health
    envVars:
      - key: WPGO_CONTROL_ADMIN_TOKEN
        generateValue: true
      - key: WPGO_SIGNING_SEED
        generateValue: true
      - key: WPGO_LICENSES_JSON
        value: "{}"
      - key: WPGO_REVOKED_LICENSE_IDS
        value: ""
      - key: WPGO_RELEASE_VERSION
        value: "4.4.5"
      - key: WPGO_RELEASE_PACKAGE
        value: ""
      - key: WPGO_RELEASE_SHA256
        value: ""
      - key: WPGO_RELEASE_URL
        value: ""
      - key: PORT
        value: "10000"

  - type: web
    name: wpgo-commercial-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd portal && npm install
    startCommand: cd portal && npm start
    healthCheckPath: /health

  - type: web
    name: wpgo-commercial-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd commercial-api && npm install
    startCommand: cd commercial-api && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wpgo-commercial-db
          property: connectionString
      - key: WPGO_SESSION_SECRET
        generateValue: true
      - key: WPGO_DEV_AUTH
        value: "0"
      - key: RESEND_API_KEY
        sync: false
      - key: WPGO_LOGIN_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: wpgo-commercial-db
    plan: free
    region: frankfurt
