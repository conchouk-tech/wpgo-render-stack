name: Pin WPGo RC dependencies

on:
  push:
    branches:
      - 'release/wpgo-4.5.0-rc*'

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize RC3 source when on RC3 branch
        if: github.ref_name == 'release/wpgo-4.5.0-rc3'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path('mcp-gateway/server-rc.js')
          text = gateway.read_text()
          text = text.replace("const VERSION = '1.4.1-rc.2';", "const VERSION = '1.4.2-rc.3';")
          text = text.replace("const PRODUCT_VERSION = '4.5.0-rc.2';", "const PRODUCT_VERSION = '4.5.0-rc.3';")
          marker = "    connection_history: true\n"
          replacement = "    connection_history: true,\n    agent_preflight: true,\n    schema_guard: true\n"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          gateway.write_text(text)

          renderer = Path('renderer/server.js')
          text = renderer.read_text()
          text = text.replace("const VERSION = '4.4.0-rc.2';", "const VERSION = '4.4.1-rc.3';")
          concurrency = "const maxConcurrency = Math.max(1, Math.min(12, Number(process.env.WPGO_RENDER_MAX_CONCURRENCY || 3)));\n"
          viewports = """const maxConcurrency = Math.max(1, Math.min(12, Number(process.env.WPGO_RENDER_MAX_CONCURRENCY || 3)));
const VIEWPORTS = Object.freeze({
  desktop: { width: 1440, height: 900, isMobile: false, hasTouch: false },
  tablet: { width: 820, height: 1180, isMobile: false, hasTouch: true },
  mobile: { width: 390, height: 844, isMobile: true, hasTouch: true }
});
"""
          if concurrency in text and 'const VIEWPORTS = Object.freeze' not in text:
              text = text.replace(concurrency, viewports, 1)
          health = "    site_audit: true,\n"
          if health in text and 'viewport_presets:' not in text:
              text = text.replace(health, health + "    viewport_presets: Object.keys(VIEWPORTS),\n", 1)
          audit_input = "  const fullPage = req.body?.full_page === true;\n"
          if audit_input in text and 'const viewportName =' not in text:
              text = text.replace(audit_input, audit_input + "  const viewportName = ['desktop', 'tablet', 'mobile'].includes(String(req.body?.viewport || 'desktop')) ? String(req.body?.viewport || 'desktop') : 'desktop';\n  const viewport = VIEWPORTS[viewportName];\n", 1)
          hardcoded = "      viewport: { width: 1365, height: 768 }\n"
          if hardcoded in text:
              text = text.replace(hardcoded, "      viewport: { width: viewport.width, height: viewport.height },\n      isMobile: viewport.isMobile,\n      hasTouch: viewport.hasTouch\n", 1)
          result = "      ok: true, request_id: requestId, final_url: finalUrl, http_status: response?.status() || 0,\n"
          if result in text and 'viewport: viewportName' not in text:
              text = text.replace(result, "      ok: true, request_id: requestId, final_url: finalUrl, http_status: response?.status() || 0,\n      viewport: viewportName, viewport_size: { width: viewport.width, height: viewport.height },\n", 1)
          renderer.write_text(text)

          renderer_package = Path('renderer/package.json')
          text = renderer_package.read_text().replace('"version": "4.4.0-rc.2"', '"version": "4.4.1-rc.3"')
          renderer_package.write_text(text)

          connect = Path('wordpress-plugin/includes/class-wpgo-connect-ai.php')
          text = connect.read_text().replace("const VERSION = '4.5.0-rc.2';", "const VERSION = '4.5.0-rc.3';")
          connect.write_text(text)

          agent = Path('wordpress-plugin/includes/class-wpgo-agent-experience.php')
          text = agent.read_text()
          preflight_anchor = "\t\t$manifest = self::manifest();\n\t\t$input    = is_array( $input ) ? $input : array();\n"
          media_preflight = """\t\t$manifest = self::manifest();
\t\t$input    = is_array( $input ) ? $input : array();

\t\tif ( 'wpgo/upload-media-from-url' === $name && class_exists( 'WPGo_Media_Abilities_RC3' ) ) {
\t\t\treturn WPGo_Media_Abilities_RC3::preflight_remote_url( $input['url'] ?? '' );
\t\t}
"""
          if preflight_anchor in text and "'wpgo/upload-media-from-url' === $name" not in text:
              text = text.replace(preflight_anchor, media_preflight, 1)
          label_anchor = "\t\t\t'wpgo/structured-builder-batch-edit'     => 'Apply a structured builder edit plan',\n"
          label_extra = "\t\t\t'wpgo/upload-media-from-url'             => 'Upload one media file from a validated public HTTPS URL',\n\t\t\t'wpgo/request-media-upload'              => 'Create a short-lived local-device media upload session',\n\t\t\t'wpgo/theme-setting-update'              => 'Update one reviewed safe theme setting',\n"
          if label_anchor in text and "'wpgo/upload-media-from-url'             =>" not in text:
              text = text.replace(label_anchor, label_anchor + label_extra, 1)
          agent.write_text(text)

          ci = Path('.github/workflows/commercial-hardening.yml')
          text = ci.read_text()
          text = text.replace('1.4.1-rc.2', '1.4.2-rc.3').replace('4.5.0-rc.2', '4.5.0-rc.3')
          text = text.replace('RC2', 'RC3')
          health_old = "if (!health.wordpress_first_onboarding || !health.site_specific_mcp_urls || !health.approval_proxy || !health.connection_history) {"
          health_new = "if (!health.wordpress_first_onboarding || !health.site_specific_mcp_urls || !health.approval_proxy || !health.connection_history || !health.agent_preflight || !health.schema_guard) {"
          text = text.replace(health_old, health_new)
          lint_marker = "          php -l wordpress-plugin/includes/class-wpgo-connect-ai.php\n"
          lint_block = "          php -l wordpress-plugin/includes/class-wpgo-agent-experience.php\n          php -l wordpress-plugin/includes/class-wpgo-theme-settings.php\n          php -l wordpress-plugin/includes/class-wpgo-media-abilities.php\n          php wordpress-plugin/tests/agent-experience-smoke.php\n          php wordpress-plugin/tests/media-abilities-smoke.php\n"
          if lint_marker in text and 'media-abilities-smoke.php' not in text:
              text = text.replace(lint_marker, lint_marker + lint_block, 1)
          package_dir = '/tmp/wpgo-connect-ai-4.5.0-rc.3/wpgo-connect-ai/includes/'
          copy_marker = f"          cp wordpress-plugin/includes/class-wpgo-connect-ai.php {package_dir}\n"
          copy_block = f"          cp wordpress-plugin/includes/class-wpgo-agent-experience.php {package_dir}\n          cp wordpress-plugin/includes/class-wpgo-theme-settings.php {package_dir}\n          cp wordpress-plugin/includes/class-wpgo-media-abilities.php {package_dir}\n"
          if copy_marker in text and 'class-wpgo-media-abilities.php /tmp/' not in text:
              text = text.replace(copy_marker, copy_marker + copy_block, 1)
          ci.write_text(text)
          PY
      - name: Generate exact npm lockfiles
        run: |
          for dir in mcp-gateway commercial-api portal control-plane renderer; do
            (cd "$dir" && npm install --package-lock-only --ignore-scripts)
          done
      - name: Commit final RC3 source and lockfiles if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp-gateway/server-rc.js mcp-gateway/package-lock.json renderer/server.js renderer/package.json renderer/package-lock.json wordpress-plugin/includes/class-wpgo-connect-ai.php wordpress-plugin/includes/class-wpgo-agent-experience.php .github/workflows/commercial-hardening.yml commercial-api/package-lock.json portal/package-lock.json control-plane/package-lock.json
          if git diff --cached --quiet; then
            echo 'RC3 source and lockfiles already current.'
            exit 0
          fi
          git commit -m 'Finalize WPGo 4.5 RC3 source and dependency graph'
          git push origin HEAD:${GITHUB_REF_NAME}
