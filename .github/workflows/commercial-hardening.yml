name: WPGo release candidate

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject free or ephemeral production connection infrastructure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('render.yaml').read_text()

          def block_after(marker, until='\n  - type:'):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing blueprint resource: {marker}')
              end = text.find(until, start + len(marker))
              if end < 0:
                  end = len(text)
              return text[start:end]

          critical = [
              'name: wpgo-mcp-ga',
              'name: wpgo-commercial-web',
              'name: wpgo-commercial-api',
              'name: wpgo-control-plane-ga',
          ]
          for marker in critical:
              block = block_after(marker)
              if re.search(r'(?m)^\s*plan:\s*free\s*$', block):
                  raise SystemExit(f'{marker} must not use Render free compute in the production blueprint')

          kv = block_after('name: wpgo-mcp-state')
          if re.search(r'(?m)^\s*plan:\s*free\s*$', kv):
              raise SystemExit('wpgo-mcp-state must use persistent paid Key Value')
          if not re.search(r'(?m)^\s*persistenceMode:\s*journal-snapshot\s*$', kv):
              raise SystemExit('wpgo-mcp-state must use journal-snapshot persistence')

          db_start = text.find('name: wpgo-commercial-db')
          if db_start < 0:
              raise SystemExit('missing wpgo-commercial-db')
          db = text[db_start:]
          if re.search(r'(?m)^\s*plan:\s*free\s*$', db):
              raise SystemExit('wpgo-commercial-db must not use the expiring Render free database')

          mcp = block_after('name: wpgo-mcp-ga')
          for required in ('WPGO_MCP_SECRET', 'WPGO_REQUIRE_SHARED_OAUTH_STATE', 'REDIS_URL'):
              if required not in mcp:
                  raise SystemExit(f'wpgo-mcp-ga missing {required}')

          print('Production blueprint persistence/always-on gate passed.')
          PY

  mcp-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Full WordPress-first OAuth and MCP integration test
        env:
          NODE_ENV: test
          PORT: '8095'
          WPGO_MCP_SECRET: ci-only-mcp-secret-value-not-for-production-use
          WPGO_MCP_PUBLIC_BASE: http://127.0.0.1:8095
          WPGO_REQUIRE_SHARED_OAUTH_STATE: '0'
          WPGO_TEST_ALLOW_LOOPBACK_PORTS: '9443'
          WPGO_MOCK_WP_PORT: '9443'
          WPGO_E2E_GATEWAY: http://127.0.0.1:8095
          WPGO_E2E_WORDPRESS: https://127.0.0.1:9443/
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/wpgo-mock-key.pem \
            -out /tmp/wpgo-mock-cert.pem \
            -subj '/CN=127.0.0.1' \
            -days 1 \
            -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          node mock-wordpress.js >/tmp/wpgo-mock.log 2>&1 &
          mock_pid=$!
          npm start >/tmp/wpgo-mcp.log 2>&1 &
          gateway_pid=$!
          trap 'kill $gateway_pid $mock_pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8095/health >/tmp/wpgo-mcp-health.json && \
               curl -kfsS https://127.0.0.1:9443/wp-json/ >/tmp/wpgo-mock-health.json; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:8095/health');
          const health = await response.json();
          if (!response.ok || !health.ok) throw new Error('MCP gateway did not become healthy');
          if (health.version !== '1.4.0-rc.1' || health.product_version !== '4.5.0-rc.1') throw new Error('RC version contract failed');
          if (!health.wordpress_first_onboarding || !health.site_specific_mcp_urls || !health.approval_proxy) throw new Error('RC onboarding capability contract failed');
          NODE
          npm run test:rc-onboarding
          sleep 2
          grep -q '"event":"wpgo_mcp_self_test".*"ok":true' /tmp/wpgo-mcp.log

  wordpress-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: PHP syntax gate
        run: |
          php -l wordpress-plugin/wpgo-connect-ai-rc.php
          php -l wordpress-plugin/includes/class-wpgo-connect-ai.php
      - name: Reject development-only WordPress module patterns
        run: |
          ! grep -RniE 'localhost|127\.0\.0\.1|WPGO_DEV_AUTH|var_dump\(|print_r\(' wordpress-plugin
      - name: Build RC WordPress module ZIP
        run: |
          mkdir -p /tmp/wpgo-connect-ai-4.5.0-rc.1/wpgo-connect-ai/includes
          cp wordpress-plugin/wpgo-connect-ai-rc.php /tmp/wpgo-connect-ai-4.5.0-rc.1/wpgo-connect-ai/wpgo-connect-ai.php
          cp wordpress-plugin/includes/class-wpgo-connect-ai.php /tmp/wpgo-connect-ai-4.5.0-rc.1/wpgo-connect-ai/includes/
          cd /tmp/wpgo-connect-ai-4.5.0-rc.1
          zip -qr "$GITHUB_WORKSPACE/wpgo-connect-ai-4.5.0-rc.1.zip" wpgo-connect-ai
          sha256sum "$GITHUB_WORKSPACE/wpgo-connect-ai-4.5.0-rc.1.zip" > "$GITHUB_WORKSPACE/wpgo-connect-ai-4.5.0-rc.1.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wpgo-connect-ai-4.5.0-rc.1
          path: |
            wpgo-connect-ai-4.5.0-rc.1.zip
            wpgo-connect-ai-4.5.0-rc.1.sha256
          if-no-files-found: error

  commercial-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: wpgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wpgo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: commercial-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Database and API startup smoke test
        env:
          NODE_ENV: production
          PORT: '8081'
          DATABASE_URL: postgresql://postgres:ci-database-password@localhost:5432/wpgo
          WPGO_SESSION_SECRET: ci-only-session-secret-value-not-for-production-use
          WPGO_CONTROL_ADMIN_TOKEN: ci-only-control-token-value-not-for-production-use
          WPGO_DEV_AUTH: '0'
          RESEND_API_KEY: ci-email-provider-placeholder
          WPGO_LOGIN_FROM_EMAIL: noreply@example.com
        run: |
          npm start >/tmp/wpgo-api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8081/health >/tmp/wpgo-api-health.json; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:8081/health');
          const health = await response.json();
          if (!response.ok || !health.ok || health.database !== 'ready') throw new Error('Commercial API runtime health failed');
          NODE

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Signed licence issue and validate smoke test
        env:
          NODE_ENV: production
          PORT: '8090'
          WPGO_CONTROL_ADMIN_TOKEN: ci-only-control-token-value-not-for-production-use
          WPGO_SIGNING_SEED: ci-only-signing-seed-not-for-production-use
          WPGO_ALLOW_UNBOUND_LICENSES: '0'
        run: |
          npm start >/tmp/wpgo-control.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8090/health >/tmp/wpgo-control-health.json; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const admin = process.env.WPGO_CONTROL_ADMIN_TOKEN;
          const issuedResponse = await fetch('http://127.0.0.1:8090/v1/admin/license/issue', {
            method: 'POST',
            headers: {'content-type':'application/json', authorization:`Bearer ${admin}`},
            body: JSON.stringify({plan:'pro', site_hosts:['example.com'], features:['updates','support']})
          });
          const issued = await issuedResponse.json();
          if (!issuedResponse.ok || !issued.license_key?.startsWith('wpgo1.')) throw new Error('Licence issue failed');
          const validatedResponse = await fetch('http://127.0.0.1:8090/v1/license/validate', {
            method: 'POST', headers: {'content-type':'application/json'},
            body: JSON.stringify({license_key:issued.license_key, site_url:'https://example.com/'})
          });
          const validated = await validatedResponse.json();
          if (!validatedResponse.ok || validated.payload?.status !== 'active') throw new Error('Licence validation failed');
          NODE

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Production startup smoke test
        env:
          NODE_ENV: production
          PORT: '8080'
          WPGO_PORTAL_CSRF_SECRET: ci-only-csrf-secret-value-not-for-production-use
          WPGO_COMMERCIAL_API: https://wpgo-commercial-api.example.com
        run: |
          npm start >/tmp/wpgo-portal.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/wpgo-portal-health.json; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:8080/health');
          const health = await response.json();
          if (!response.ok || !health.ok || health.pairing_confirmation !== true || health.csrf_protection !== true) throw new Error('Portal runtime health failed');
          NODE

  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
