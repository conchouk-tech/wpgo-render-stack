name: WPGo dependency security

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - mcp-gateway
          - commercial-api
          - portal
          - control-plane
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Reject high or critical advisories
        run: npm audit --audit-level=high

  wordpress-static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secret/debug patterns
        run: |
          ! grep -RniE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk_live_|sk_test_|password\s*=\s*["'"'][^"'"']+["'"']|var_dump\(|print_r\(|error_log\([^)]*password)' wordpress-plugin
